<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macro Diary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Macro Diary</title>
<script>
// apply saved theme before first paint to avoid a flash
try{var d=JSON.parse(localStorage.getItem('macrodiary.v1')),t=(d&&d.theme)||{},m=t.mode||'system',
dk=m==='dark'||m==='black'||(m==='system'&&matchMedia('(prefers-color-scheme:dark)').matches),r=document.documentElement;
r.dataset.scheme=dk?'dark':'light';r.dataset.theme=t.color||'green';if(m==='black')r.dataset.black='';}catch(e){}
</script>
<style>
:root{
  --bg:#f5f6f4;--card:#fff;--text:#1a1f1c;--muted:#667069;--line:#e3e7e2;
  --accent:#16a34a;--accent-ink:#fff;--kcal:#16a34a;--p:#3b82f6;--c:#f59e0b;--f:#ef4444;--over:#dc2626;
  --nav-h:60px;color-scheme:light;
}
:root{--kcal:var(--accent)}
:root[data-scheme=dark]{color-scheme:dark;--bg:#101311;--card:#1a1f1c;--text:#eef2ee;--muted:#9aa59d;--line:#2a312c;--accent:#22c55e;--accent-ink:#06210f;--p:#60a5fa;--c:#fbbf24;--f:#f87171}
:root[data-scheme=dark][data-black]{--bg:#000;--card:#0c0e0d;--line:#1f2421}
/* colour themes: light variant, then dark variant */
:root[data-theme=blue]{--accent:#2563eb;--accent-ink:#fff}
:root[data-theme=blue][data-scheme=dark]{--accent:#60a5fa;--accent-ink:#08152e}
:root[data-theme=purple]{--accent:#7c3aed;--accent-ink:#fff}
:root[data-theme=purple][data-scheme=dark]{--accent:#a78bfa;--accent-ink:#1a0b3b}
:root[data-theme=orange]{--accent:#c2410c;--accent-ink:#fff}
:root[data-theme=orange][data-scheme=dark]{--accent:#fb923c;--accent-ink:#2b1103}
:root[data-theme=rose]{--accent:#e11d48;--accent-ink:#fff}
:root[data-theme=rose][data-scheme=dark]{--accent:#fb7185;--accent-ink:#2d0610}
:root[data-theme=teal]{--accent:#0f766e;--accent-ink:#fff}
:root[data-theme=teal][data-scheme=dark]{--accent:#2dd4bf;--accent-ink:#042f2a}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sw{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--text)}
.sw-lbl{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 0 8px}
h1{font-size:18px;margin:0}
h2{font-size:15px;margin:0}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
button{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{border:none;background:none}
button.danger{color:var(--over)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>.fit{flex:0 0 auto}
.muted{color:var(--muted);font-size:13px}
.datebar{display:flex;align-items:center;gap:6px}
.datebar .lbl{flex:1;text-align:center;font-weight:600}
.datebar button{width:44px;padding:0;flex:0 0 44px;font-size:20px}
.big{font-size:34px;font-weight:700;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--kcal)}
.bar.over>i{background:var(--over)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.macros b{display:block;font-size:15px}
.meal-h{display:flex;align-items:center;justify-content:space-between}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.entry .nm{flex:1;min-width:0}
.entry .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .k{font-weight:600;white-space:nowrap}
.entry .x{flex:0 0 36px;min-height:36px;padding:0;border:none;background:none;color:var(--muted);font-size:20px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:none;border-radius:0;min-height:var(--nav-h);background:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button span{font-size:20px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.view{display:none}.view.on{display:block}
dialog{border:none;padding:0;background:var(--card);color:var(--text);width:100%;max-width:560px;max-height:92dvh;
  border-radius:18px 18px 0 0;margin:auto auto 0;overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.5)}
@media (min-width:640px){dialog{margin:auto;border-radius:18px}}
.dlg-in{display:flex;flex-direction:column;max-height:92dvh}
.dlg-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dlg-head h2{flex:1}
.dlg-body{overflow:auto;padding:12px 14px calc(env(safe-area-inset-bottom) + 16px);-webkit-overflow-scrolling:touch}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;min-height:38px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.res{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.res .nm{flex:1;min-width:0}
.res .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;padding:2px 6px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;border-top:none}
.tscroll{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stats b{display:block;font-size:20px}
.mini{height:6px;background:var(--line);border-radius:9px;min-width:50px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--kcal)}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0}.chk input{width:auto;min-height:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);background:#222;color:#fff;
  padding:10px 16px;border-radius:99px;z-index:50;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
video{width:100%;border-radius:12px;background:#000;max-height:50dvh}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="datebar" id="datebar">
    <button id="prev" aria-label="Previous day">‹</button>
    <div class="lbl" id="dateLbl"></div>
    <button id="next" aria-label="Next day">›</button>
  </div>
</div></header>

<main class="wrap">
  <!-- DIARY -->
  <section class="view on" id="v-diary">
    <div class="card" id="summary"></div>
    <div id="meals"></div>
    <div class="row" style="margin-top:6px">
      <button id="shareBtn" class="fit">⤴ Share day</button>
      <button id="todayBtn">Jump to today</button>
    </div>
  </section>

  <!-- EXPORT -->
  <section class="view" id="v-export">
    <div class="card">
      <h2>Export your data</h2>
      <div class="row">
        <div><label for="xKind">Period</label>
          <select id="xKind"><option value="day">Daily</option><option value="week" selected>Weekly</option><option value="month">Monthly</option><option value="year">Yearly</option></select></div>
        <div><label for="xDate">Containing date</label><input type="date" id="xDate"></div>
      </div>
      <div class="muted" id="xRange" style="margin-top:8px"></div>
    </div>
    <div class="card" id="xStats"></div>
    <div class="card tscroll" id="xTable"></div>
    <div class="card">
      <div class="row"><button class="primary" id="xEntries">Download entries (CSV)</button></div>
      <div class="row" style="margin-top:8px"><button id="xSummary">Download summary (CSV)</button><button id="xJson">Download JSON</button></div>
      <div class="row" style="margin-top:8px"><button id="xShare">⤴ Share this summary</button></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="v-settings">
    <div class="card">
      <h2>Appearance</h2>
      <label>Mode</label>
      <div class="seg" id="modeSeg" style="margin-bottom:0">
        <button data-mode="system">System</button><button data-mode="light">Light</button><button data-mode="dark">Dark</button><button data-mode="black">Black</button>
      </div>
      <label>Colour theme</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="card">
      <h2>Daily goals</h2>
      <div class="row"><div><label>Calories</label><input id="gK" type="number" inputmode="numeric"></div><div><label>Protein (g)</label><input id="gP" type="number" inputmode="numeric"></div></div>
      <div class="row"><div><label>Carbs (g)</label><input id="gC" type="number" inputmode="numeric"></div><div><label>Fat (g)</label><input id="gF" type="number" inputmode="numeric"></div></div>
    </div>
    <div class="card">
      <h2>Food databases</h2>
      <div class="chk"><input type="checkbox" id="srcUSDA"><label style="margin:0;color:inherit">USDA FoodData Central</label></div>
      <div class="chk"><input type="checkbox" id="srcOFF"><label style="margin:0;color:inherit">Open Food Facts (packaged foods &amp; barcodes)</label></div>
      <label for="apiKey">USDA API key</label>
      <input id="apiKey" placeholder="DEMO_KEY" autocapitalize="off" autocomplete="off">
      <p class="muted">The built-in DEMO_KEY is heavily rate-limited. Get a free key at fdc.nal.usda.gov/api-key-signup and paste it here.</p>
    </div>
    <div class="card">
      <h2>Backup</h2>
      <p class="muted">Your data is stored on this device only. Use backup/restore to move it between your phone and PC.</p>
      <div class="row"><button id="bkExport">Backup to file</button><button id="bkImport">Restore from file</button></div>
      <input type="file" id="bkFile" accept="application/json" hidden>
      <div class="row" style="margin-top:8px"><button class="danger" id="wipe">Delete all data</button></div>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="diary" class="on"><span>📖</span>Diary</button>
  <button data-tab="export"><span>📤</span>Export</button>
  <button data-tab="settings"><span>⚙️</span>Settings</button>
</nav>

<dialog id="dlg"><div class="dlg-in">
  <div class="dlg-head"><button class="ghost fit" id="dBack" hidden>‹</button><h2 id="dTitle">Add food</h2><button class="ghost fit" id="dClose" aria-label="Close">✕</button></div>
  <div class="dlg-body" id="dBody"></div>
</div></dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];
const rd = n => Math.round(n || 0);
const r1 = n => Math.round((n || 0) * 10) / 10;

/* ---------- state ---------- */
const defaults = () => ({theme:{mode:'system', color:'green'}, goals:{k:2000,p:150,c:200,f:65}, apiKey:'', useUSDA:true, useOFF:true, days:{}, recent:[], custom:[]});
let S = (() => { try { const d = JSON.parse(localStorage.getItem('macrodiary.v1')); if (d) return {...defaults(), ...d}; } catch {} return defaults(); })();
const save = () => { try { localStorage.setItem('macrodiary.v1', JSON.stringify(S)); } catch { toast('Could not save – storage full or blocked'); } };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- dates ---------- */
const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return fmt(d); };
const pretty = s => parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
let cur = fmt(new Date());

/* ---------- math ---------- */
const entryMacros = e => { const f = e.grams/100; return {k:e.per100.k*f, p:e.per100.p*f, c:e.per100.c*f, f:e.per100.f*f}; };
const totals = list => list.reduce((t,e) => { const m = entryMacros(e); t.k+=m.k; t.p+=m.p; t.c+=m.c; t.f+=m.f; return t; }, {k:0,p:0,c:0,f:0});

/* ---------- theme ---------- */
const THEMES = {green:['Green','#16a34a'], blue:['Ocean','#2563eb'], teal:['Teal','#0f766e'], purple:['Grape','#7c3aed'], orange:['Sunset','#c2410c'], rose:['Rose','#e11d48']};
const darkMQ = matchMedia('(prefers-color-scheme:dark)');
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){
  const t = {mode:'system', color:'green', ...S.theme}, root = document.documentElement;
  const dark = t.mode === 'dark' || t.mode === 'black' || (t.mode === 'system' && darkMQ.matches);
  root.dataset.scheme = dark ? 'dark' : 'light';
  root.dataset.theme = THEMES[t.color] ? t.color : 'green';
  if (t.mode === 'black') root.dataset.black = ''; else delete root.dataset.black;
  document.querySelector('meta[name=theme-color]').content = cssVar('--bg') || '#16a34a';
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === t.mode));
  document.querySelectorAll('#swatches [data-color]').forEach(b => b.classList.toggle('on', b.dataset.color === t.color));
}
darkMQ.addEventListener?.('change', applyTheme);
$('#swatches').innerHTML = Object.entries(THEMES).map(([k,[n,c]]) =>
  `<div><button class="sw" data-color="${k}" style="background:${c}" aria-label="${n} theme"></button><div class="sw-lbl">${n}</div></div>`).join('');
$('#modeSeg').onclick = e => { const b = e.target.closest('[data-mode]'); if (b) { S.theme = {...S.theme, mode:b.dataset.mode}; save(); applyTheme(); } };
$('#swatches').onclick = e => { const b = e.target.closest('[data-color]'); if (b) { S.theme = {...S.theme, color:b.dataset.color}; save(); applyTheme(); } };

/* ---------- tabs ---------- */
function tab(name){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-'+name));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $('#datebar').style.display = name === 'diary' ? '' : 'none';
  if (name === 'export') renderExport();
  if (name === 'settings') loadSettings();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => tab(b.dataset.tab));

/* ---------- diary ---------- */
function bar(val, goal, color){
  const pct = goal ? Math.min(100, val/goal*100) : 0;
  return `<div class="bar ${goal && val>goal?'over':''}"><i style="width:${pct}%;${color && !(goal&&val>goal)?`background:${color}`:''}"></i></div>`;
}
function renderDiary(){
  $('#dateLbl').textContent = cur === fmt(new Date()) ? 'Today' : pretty(cur);
  const list = S.days[cur] || [], t = totals(list), g = S.goals, left = g.k - t.k;
  const mac = (n,k,col) => `<div><span class="muted">${n}</span><b>${rd(t[k])} / ${g[k]}g</b>${bar(t[k], g[k], col)}</div>`;
  $('#summary').innerHTML =
    `<div class="row" style="align-items:flex-end"><div><div class="big">${rd(t.k)}</div><div class="muted">of ${g.k} kcal eaten</div></div>
     <div style="text-align:right"><div class="big" style="font-size:24px;${left<0?'color:var(--over)':''}">${rd(Math.abs(left))}</div><div class="muted">${left<0?'over':'remaining'}</div></div></div>
     ${bar(t.k, g.k)}
     <div class="macros">${mac('Protein','p','var(--p)')}${mac('Carbs','c','var(--c)')}${mac('Fat','f','var(--f)')}</div>`;
  $('#meals').innerHTML = MEALS.map(m => {
    const es = list.filter(e => e.meal === m), mk = es.reduce((a,e) => a + entryMacros(e).k, 0);
    return `<div class="card"><div class="meal-h"><div><h2>${m}</h2><span class="muted">${rd(mk)} kcal</span></div>
      <button class="primary fit" data-add="${m}">+ Add</button></div>` +
      es.map(e => `<div class="entry" data-edit="${e.id}"><div class="nm"><div>${esc(e.name)}</div>
        <div class="muted">${esc(e.brand ? e.brand + ' · ' : '')}${rd(e.grams)} g · P${rd(entryMacros(e).p)} C${rd(entryMacros(e).c)} F${rd(entryMacros(e).f)}</div></div>
        <div class="k">${rd(entryMacros(e).k)}</div><button class="x" data-del="${e.id}" aria-label="Delete">✕</button></div>`).join('') + `</div>`;
  }).join('');
}
$('#prev').onclick = () => { cur = addDays(cur,-1); renderDiary(); };
$('#next').onclick = () => { cur = addDays(cur,1); renderDiary(); };
$('#todayBtn').onclick = () => { cur = fmt(new Date()); renderDiary(); };
$('#meals').onclick = ev => {
  const del = ev.target.closest('[data-del]'), add = ev.target.closest('[data-add]'), ed = ev.target.closest('[data-edit]');
  if (del) { ev.stopPropagation(); S.days[cur] = (S.days[cur]||[]).filter(e => e.id !== del.dataset.del); if (!S.days[cur].length) delete S.days[cur]; save(); renderDiary(); }
  else if (add) openAdd(add.dataset.add);
  else if (ed) { const e = (S.days[cur]||[]).find(x => x.id === ed.dataset.edit); if (e) openAdd(e.meal, e); }
};

/* ---------- dialog: add / edit ---------- */
const dlg = $('#dlg');
let dctx = {meal:'Breakfast', edit:null, tab:'search', results:[], q:''};
$('#dClose').onclick = () => { stopScan(); dlg.close(); };
dlg.addEventListener('close', stopScan);
dlg.addEventListener('click', e => { if (e.target === dlg) { stopScan(); dlg.close(); } });
$('#dBack').onclick = () => { stopScan(); renderSearchTab(); };

function openAdd(meal, edit){
  dctx = {meal, edit: edit || null, tab:'search', results:[], q:''};
  if (!dlg.open) dlg.showModal();
  if (edit) showFood(edit, edit);
  else renderAddTabs();
}
function head(title, back){ $('#dTitle').textContent = title; $('#dBack').hidden = !back; }

function renderAddTabs(){
  head('Add to ' + dctx.meal, false);
  $('#dBody').innerHTML = `<div class="seg"><button data-t="search">Search</button><button data-t="custom">Custom</button></div><div id="tabBody"></div>`;
  $('#dBody').querySelectorAll('.seg button').forEach(b => b.onclick = () => { dctx.tab = b.dataset.t; renderAddTabs(); });
  $('#dBody').querySelector(`.seg [data-t=${dctx.tab}]`).classList.add('on');
  dctx.tab === 'search' ? renderSearchTab(true) : renderCustom();
}
function renderSearchTab(fromTabs){
  if (!fromTabs) { renderAddTabs(); return; }
  head('Add to ' + dctx.meal, false);
  $('#tabBody').innerHTML = `<div class="row"><input id="q" type="search" placeholder="Search foods or enter barcode" enterkeyhint="search" autocomplete="off" value="${esc(dctx.q)}">
    <button class="fit" id="goSearch">Search</button>${('BarcodeDetector' in window) ? '<button class="fit" id="scan" aria-label="Scan barcode">📷</button>' : ''}</div>
    <div id="results"></div>`;
  $('#goSearch').onclick = doSearch;
  $('#q').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } };
  $('#q').oninput = () => { dctx.q = $('#q').value; renderResults(); };
  if ($('#scan')) $('#scan').onclick = startScan;
  renderResults();
}
function localMatches(q){
  q = q.toLowerCase();
  const all = [...S.custom.map(f => ({...f, tag:'My food'})), ...S.recent.map(f => ({...f, tag:'Recent'}))];
  const seen = new Set();
  return all.filter(f => (!q || (f.name + ' ' + (f.brand||'')).toLowerCase().includes(q)) && !seen.has(foodKey(f)) && seen.add(foodKey(f))).slice(0, 15);
}
const foodKey = f => [f.name, f.brand, f.source].join('|');
function resHTML(list, from){
  return list.map((f,i) => `<div class="res" data-i="${i}" data-from="${from}"><div class="nm"><div>${esc(f.name)}</div>
    <div class="muted">${esc(f.brand ? f.brand + ' · ' : '')}${rd(f.per100.k)} kcal /100g · P${r1(f.per100.p)} C${r1(f.per100.c)} F${r1(f.per100.f)}</div></div>
    <span class="badge">${esc(f.tag || f.source)}</span></div>`).join('');
}
let localList = [];
function renderResults(msg){
  const el = $('#results'); if (!el) return;
  localList = localMatches(dctx.q);
  el.innerHTML = (localList.length ? `<div class="muted" style="margin-top:12px">Your foods</div>` + resHTML(localList,'l') : '')
    + (msg ? `<p class="muted" style="margin-top:12px">${esc(msg)}</p>` : '')
    + (dctx.results.length ? `<div class="muted" style="margin-top:12px">Database results</div>` + resHTML(dctx.results,'r') : '');
  el.onclick = ev => { const r = ev.target.closest('.res'); if (!r) return;
    showFood((r.dataset.from === 'l' ? localList : dctx.results)[+r.dataset.i]); };
}
async function doSearch(){
  const q = $('#q').value.trim(); dctx.q = q; if (!q) return;
  if (!S.useUSDA && !S.useOFF) { renderResults('Enable a food database in Settings.'); return; }
  renderResults('Searching…'); dctx.results = [];
  const jobs = [];
  if (S.useOFF) jobs.push(searchOFF(q).then(r => ({n:'Open Food Facts', r}), e => ({n:'Open Food Facts', e})));
  if (S.useUSDA && !/^\d{8,14}$/.test(q)) jobs.push(searchUSDA(q).then(r => ({n:'USDA', r}), e => ({n:'USDA', e})));
  const out = await Promise.all(jobs);
  if ($('#q')?.value.trim() !== q) return;
  const errs = out.filter(o => o.e).map(o => `${o.n}: ${o.e.message}`);
  // interleave sources so both are visible
  const lists = out.filter(o => o.r).map(o => o.r); dctx.results = [];
  for (let i = 0; lists.some(l => i < l.length); i++) lists.forEach(l => l[i] && dctx.results.push(l[i]));
  renderResults(!dctx.results.length ? (errs.join(' · ') || 'No results found.') : errs.join(' · '));
}

/* ---------- food databases ---------- */
async function getJSON(url){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(url, {signal: ctl.signal});
    if (r.status === 429) throw new Error('rate limited – add your own USDA key in Settings');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'timed out' : e.message === 'Failed to fetch' ? 'network error' : e.message); }
  finally { clearTimeout(t); }
}
const OFF_FIELDS = 'code,product_name,brands,nutriments,serving_quantity';
function mapOFF(p){
  const n = p.nutriments || {}; if (!p.product_name) return null;
  let k = n['energy-kcal_100g']; if (k == null && n.energy_100g != null) k = n.energy_100g / 4.184;
  if (k == null) return null;
  return {name:p.product_name, brand:(p.brands||'').split(',')[0].trim(), source:'OFF',
    per100:{k:+k, p:+n.proteins_100g||0, c:+n.carbohydrates_100g||0, f:+n.fat_100g||0}, servingG:+p.serving_quantity || 0};
}
async function searchOFF(q){
  if (/^\d{8,14}$/.test(q)) {
    const j = await getJSON(`https://world.openfoodfacts.org/api/v2/product/${q}.json?fields=${OFF_FIELDS}`);
    const f = j.status === 1 && mapOFF(j.product); return f ? [f] : [];
  }
  const j = await getJSON(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=15&fields=${OFF_FIELDS}`);
  return (j.products || []).map(mapOFF).filter(Boolean);
}
function usdaNut(list, num, unit){ const n = list.find(x => String(x.nutrientNumber) === num && (!unit || (x.unitName||'').toUpperCase() === unit)); return n ? +n.value : null; }
function mapUSDA(f){
  const ns = f.foodNutrients || [];
  let k = usdaNut(ns,'208','KCAL') ?? usdaNut(ns,'957') ?? usdaNut(ns,'958');
  if (k == null) { const kj = usdaNut(ns,'268'); if (kj != null) k = kj / 4.184; }
  if (k == null) return null;
  const sg = f.servingSize && /^g/i.test(f.servingSizeUnit || '') ? +f.servingSize : 0;
  const name = f.description.toLowerCase() === f.description || f.description === f.description.toUpperCase()
    ? f.description.charAt(0).toUpperCase() + f.description.slice(1).toLowerCase() : f.description;
  return {name, brand:f.brandOwner || f.brandName || '', source:'USDA',
    per100:{k, p:usdaNut(ns,'203')||0, c:usdaNut(ns,'205')||0, f:usdaNut(ns,'204')||0}, servingG:sg};
}
async function searchUSDA(q){
  const key = encodeURIComponent(S.apiKey.trim() || 'DEMO_KEY');
  const url = t => `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${key}&query=${encodeURIComponent(q)}&pageSize=8&dataType=${t}`;
  // generic foods (Foundation / SR Legacy) first, then branded products
  const [g, b] = await Promise.all([getJSON(url('Foundation,SR%20Legacy')), getJSON(url('Branded')).catch(() => ({foods: []}))]);
  return [...(g.foods || []), ...(b.foods || [])].map(mapUSDA).filter(Boolean);
}

/* ---------- barcode scan ---------- */
let scanStream = null, scanTimer = null;
function stopScan(){ clearInterval(scanTimer); scanTimer = null; if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; } }
async function startScan(){
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  } catch { toast('Camera unavailable (needs HTTPS and permission)'); return; }
  const res = $('#results'); res.innerHTML = '<video id="vid" playsinline muted></video><p class="muted">Point at a barcode…</p>';
  const v = $('#vid'); v.srcObject = scanStream; await v.play();
  const det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
  scanTimer = setInterval(async () => {
    try { const codes = await det.detect(v); if (codes.length) { const c = codes[0].rawValue; stopScan(); $('#q').value = c; dctx.q = c; doSearch(); } } catch {}
  }, 400);
}

/* ---------- amount picker ---------- */
function showFood(food, existing){
  head(existing ? 'Edit entry' : 'Amount', !existing);
  const hasServ = food.servingG > 0;
  const startUnit = existing ? 'g' : hasServ ? 's' : 'g';
  const startAmt = existing ? rd(existing.grams) : hasServ ? 1 : 100;
  $('#dBody').innerHTML = `<h2>${esc(food.name)}</h2><div class="muted">${esc(food.brand)} ${food.source ? '· ' + esc(food.source) : ''}</div>
    <div class="row"><div><label>Amount</label><input id="amt" type="number" inputmode="decimal" step="any" value="${startAmt}"></div>
    <div><label>Unit</label><select id="unit"><option value="g">grams</option>${hasServ ? `<option value="s" ${startUnit==='s'?'selected':''}>serving (${rd(food.servingG)} g)</option>` : ''}</select></div></div>
    <label>Meal</label><select id="mealSel">${MEALS.map(m => `<option ${m===dctx.meal?'selected':''}>${m}</option>`).join('')}</select>
    <div class="card" id="prev2" style="margin:14px 0"></div>
    <button class="primary" style="width:100%" id="addGo">${existing ? 'Save changes' : 'Add to diary'}</button>`;
  const grams = () => { const a = +$('#amt').value || 0; return $('#unit').value === 's' ? a * food.servingG : a; };
  const upd = () => { const f = grams()/100, p = food.per100;
    $('#prev2').innerHTML = `<div class="big">${rd(p.k*f)} <span class="muted" style="font-size:14px;font-weight:400">kcal · ${rd(grams())} g</span></div>
      <div class="macros"><div><span class="muted">Protein</span><b>${r1(p.p*f)} g</b></div><div><span class="muted">Carbs</span><b>${r1(p.c*f)} g</b></div><div><span class="muted">Fat</span><b>${r1(p.f*f)} g</b></div></div>`; };
  $('#amt').oninput = upd; $('#unit').onchange = upd; upd();
  $('#addGo').onclick = () => {
    const g = grams(); if (!(g > 0)) { toast('Enter an amount'); return; }
    const meal = $('#mealSel').value;
    if (existing) { Object.assign(existing, {grams:g, meal}); }
    else {
      const e = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), meal, name:food.name, brand:food.brand||'', source:food.source||'',
        per100:food.per100, servingG:food.servingG||0, grams:g};
      (S.days[cur] ||= []).push(e);
      const rec = {name:food.name, brand:food.brand||'', source:food.source||'', per100:food.per100, servingG:food.servingG||0};
      S.recent = [rec, ...S.recent.filter(f => foodKey(f) !== foodKey(rec))].slice(0, 30);
    }
    save(); renderDiary(); dlg.close(); toast(existing ? 'Updated' : 'Added to ' + meal);
  };
}

/* ---------- export ---------- */
function rangeOf(kind, s){
  const d = parse(s); let a, b;
  if (kind === 'day') a = b = d;
  else if (kind === 'week') { a = new Date(d); a.setDate(d.getDate() - ((d.getDay()+6)%7)); b = new Date(a); b.setDate(a.getDate()+6); }
  else if (kind === 'month') { a = new Date(d.getFullYear(), d.getMonth(), 1); b = new Date(d.getFullYear(), d.getMonth()+1, 0); }
  else { a = new Date(d.getFullYear(), 0, 1); b = new Date(d.getFullYear(), 11, 31); }
  return [fmt(a), fmt(b)];
}
function xData(){
  const kind = $('#xKind').value, date = $('#xDate').value || cur, [a,b] = rangeOf(kind, date);
  const days = Object.keys(S.days).filter(d => d >= a && d <= b).sort();
  const rows = days.map(d => ({date:d, ...totals(S.days[d]), n:S.days[d].length}));
  return {kind, a, b, days, rows};
}
function rollup(x){
  if (x.kind !== 'year') return x.rows.map(r => ({label:r.date, ...r, days:1}));
  const m = {};
  x.rows.forEach(r => { const key = r.date.slice(0,7); const o = m[key] ||= {label:key, k:0,p:0,c:0,f:0, days:0}; o.k+=r.k; o.p+=r.p; o.c+=r.c; o.f+=r.f; o.days++; });
  return Object.values(m);
}
function renderExport(){
  if (!$('#xDate').value) $('#xDate').value = cur;
  const x = xData(); $('#xRange').textContent = x.a === x.b ? pretty(x.a) : `${pretty(x.a)} → ${pretty(x.b)}`;
  const tot = x.rows.reduce((t,r) => (t.k+=r.k, t.p+=r.p, t.c+=r.c, t.f+=r.f, t), {k:0,p:0,c:0,f:0}), n = x.rows.length || 1;
  $('#xStats').innerHTML = `<div class="stats"><div><span class="muted">Days logged</span><b>${x.rows.length}</b></div><div><span class="muted">Total calories</span><b>${rd(tot.k).toLocaleString()}</b></div>
    <div><span class="muted">Avg calories / day</span><b>${rd(tot.k/n)}</b></div><div><span class="muted">Avg P / C / F</span><b>${rd(tot.p/n)} / ${rd(tot.c/n)} / ${rd(tot.f/n)}</b></div></div>`;
  const rows = rollup(x), unit = x.kind === 'year' ? 'Month (avg/day)' : 'Day';
  $('#xTable').innerHTML = rows.length ? `<table><tr><th>${unit}</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th></th></tr>` + rows.map(r => {
    const d = r.days || 1; return `<tr><td>${esc(r.label)}</td><td>${rd(r.k/d)}</td><td>${rd(r.p/d)}</td><td>${rd(r.c/d)}</td><td>${rd(r.f/d)}</td>
    <td><div class="mini"><i style="width:${Math.min(100, r.k/d/S.goals.k*100)}%"></i></div></td></tr>`; }).join('') + '</table>'
    : '<p class="muted" style="margin:0">Nothing logged in this period.</p>';
}
['#xKind','#xDate'].forEach(s => $(s).onchange = renderExport);
const csvCell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function download(name, text, type){
  const blob = new Blob([text], {type}), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const xName = (x, what, ext) => `macro-diary-${what}-${x.kind}-${x.a}${x.a===x.b?'':'_to_'+x.b}.${ext}`;
$('#xEntries').onclick = () => {
  const x = xData(), rows = [['Date','Meal','Food','Brand','Amount (g)','Calories','Protein (g)','Carbs (g)','Fat (g)','Source']];
  x.days.forEach(d => S.days[d].forEach(e => { const m = entryMacros(e); rows.push([d, e.meal, e.name, e.brand, r1(e.grams), rd(m.k), r1(m.p), r1(m.c), r1(m.f), e.source]); }));
  if (rows.length === 1) return toast('Nothing to export');
  download(xName(x,'entries','csv'), toCSV(rows), 'text/csv');
};
$('#xSummary').onclick = () => {
  const x = xData(); if (!x.rows.length) return toast('Nothing to export');
  const yr = x.kind === 'year', rows = [[yr ? 'Month' : 'Date', 'Days logged', yr ? 'Avg calories/day' : 'Calories', 'Protein (g)', 'Carbs (g)', 'Fat (g)', 'Calorie goal']];
  rollup(x).forEach(r => { const d = yr ? r.days : 1; rows.push([r.label, r.days, rd(r.k/d), r1(r.p/d), r1(r.c/d), r1(r.f/d), S.goals.k]); });
  download(xName(x,'summary','csv'), toCSV(rows), 'text/csv');
};
$('#xJson').onclick = () => {
  const x = xData(); if (!x.days.length) return toast('Nothing to export');
  const days = {}; x.days.forEach(d => days[d] = S.days[d]);
  download(xName(x,'data','json'), JSON.stringify({exported:new Date().toISOString(), from:x.a, to:x.b, goals:S.goals, days}, null, 2), 'application/json');
};
$('#xShare').onclick = () => {
  const x = xData(); if (!x.rows.length) return toast('Nothing logged');
  const n = x.rows.length, t = x.rows.reduce((t,r) => (t.k+=r.k,t.p+=r.p,t.c+=r.c,t.f+=r.f,t), {k:0,p:0,c:0,f:0});
  shareText(`My ${x.kind}ly summary (${x.a}${x.a===x.b?'':' → '+x.b})\n${n} days logged · avg ${rd(t.k/n)} kcal/day\nAvg P ${rd(t.p/n)}g · C ${rd(t.c/n)}g · F ${rd(t.f/n)}g`, 'Macro Diary summary');
};

/* ---------- share day ---------- */
async function shareText(text, title){
  try { if (navigator.share) { await navigator.share({title, text}); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); } catch { prompt('Copy this:', text); }
}
function dayText(){
  const list = S.days[cur] || [], t = totals(list);
  let s = `My day – ${pretty(cur)}\n${rd(t.k)} / ${S.goals.k} kcal\nP ${rd(t.p)}g · C ${rd(t.c)}g · F ${rd(t.f)}g\n`;
  MEALS.forEach(m => { const es = list.filter(e => e.meal === m); if (!es.length) return;
    s += `\n${m} (${rd(es.reduce((a,e) => a + entryMacros(e).k, 0))} kcal)\n` + es.map(e => `• ${e.name} – ${rd(e.grams)} g, ${rd(entryMacros(e).k)} kcal`).join('\n') + '\n'; });
  return s.trim();
}
function dayImage(){
  const list = S.days[cur] || [], t = totals(list), W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const bg = cssVar('--bg'), fg = cssVar('--text'), mu = cssVar('--muted'), ln = cssVar('--line');
  x.fillStyle = bg; x.fillRect(0,0,W,H); x.fillStyle = fg; x.textBaseline = 'alphabetic';
  x.font = '600 44px system-ui,sans-serif'; x.fillText(pretty(cur), 60, 100);
  x.font = '700 150px system-ui,sans-serif'; x.fillText(String(rd(t.k)), 60, 280);
  x.fillStyle = mu; x.font = '40px system-ui,sans-serif'; x.fillText(`of ${S.goals.k} kcal`, 60, 335);
  const bars = [['Protein','p','#3b82f6'],['Carbs','c','#f59e0b'],['Fat','f','#ef4444']];
  bars.forEach(([n,k,col],i) => { const bx = 60 + i*320, w = 280;
    x.fillStyle = mu; x.font = '32px system-ui,sans-serif'; x.fillText(n, bx, 420);
    x.fillStyle = fg; x.font = '600 40px system-ui,sans-serif'; x.fillText(`${rd(t[k])} / ${S.goals[k]}g`, bx, 470);
    x.fillStyle = ln; x.fillRect(bx, 490, w, 14); x.fillStyle = col; x.fillRect(bx, 490, w * Math.min(1, t[k]/(S.goals[k]||1)), 14); });
  let y = 600;
  MEALS.forEach(m => { const es = list.filter(e => e.meal === m); if (!es.length || y > H - 120) return;
    x.fillStyle = fg; x.font = '600 38px system-ui,sans-serif'; x.fillText(`${m} · ${rd(es.reduce((a,e) => a + entryMacros(e).k, 0))} kcal`, 60, y); y += 16;
    es.forEach(e => { if (y > H - 120) return; y += 46; x.fillStyle = mu; x.font = '32px system-ui,sans-serif';
      let nm = e.name; while (x.measureText(nm).width > 760 && nm.length > 4) nm = nm.slice(0,-2); if (nm !== e.name) nm += '…';
      x.fillText(nm, 60, y); const k = `${rd(entryMacros(e).k)}`; x.fillText(k, W - 60 - x.measureText(k).width, y); });
    y += 56; });
  x.fillStyle = mu; x.font = '28px system-ui,sans-serif'; x.fillText('Macro Diary', 60, H - 50);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
$('#shareBtn').onclick = async () => {
  if (!(S.days[cur] || []).length) return toast('Nothing logged this day');
  try {
    const blob = await dayImage(), file = new File([blob], `macro-diary-${cur}.png`, {type:'image/png'});
    if (navigator.canShare?.({files:[file]})) { await navigator.share({files:[file], text: dayText(), title:'My day'}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  shareText(dayText(), 'My day');
};

/* ---------- settings ---------- */
function loadSettings(){
  $('#gK').value = S.goals.k; $('#gP').value = S.goals.p; $('#gC').value = S.goals.c; $('#gF').value = S.goals.f;
  $('#apiKey').value = S.apiKey; $('#srcUSDA').checked = S.useUSDA; $('#srcOFF').checked = S.useOFF;
}
const num = (s, d) => { const v = parseFloat($(s).value); return v >= 0 ? v : d; };
['#gK','#gP','#gC','#gF','#apiKey','#srcUSDA','#srcOFF'].forEach(s => $(s).addEventListener('change', () => {
  S.goals = {k:num('#gK',S.goals.k), p:num('#gP',S.goals.p), c:num('#gC',S.goals.c), f:num('#gF',S.goals.f)};
  S.apiKey = $('#apiKey').value.trim(); S.useUSDA = $('#srcUSDA').checked; S.useOFF = $('#srcOFF').checked; save(); renderDiary(); toast('Saved');
}));
$('#bkExport').onclick = () => download(`macro-diary-backup-${fmt(new Date())}.json`, JSON.stringify(S), 'application/json');
$('#bkImport').onclick = () => $('#bkFile').click();
$('#bkFile').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (!d || typeof d.days !== 'object' || !d.goals) throw 0;
    if (!confirm('Replace all data on this device with the backup?')) return;
    S = {...defaults(), ...d}; save(); loadSettings(); applyTheme(); renderDiary(); toast('Backup restored');
  } catch { toast('Not a valid backup file'); }
};
$('#wipe').onclick = () => { if (confirm('Delete ALL diary data on this device? This cannot be undone.')) { S = defaults(); save(); loadSettings(); applyTheme(); renderDiary(); toast('All data deleted'); } };

/* ---------- boot ---------- */
applyTheme(); tab('diary'); renderDiary();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
